name: Verify codex-pm-killer
on: [push, pull_request]
jobs:
  audit-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-knowledge.mjs
      - run: node tests/knowledge-selftest.mjs
      - run: node tests/selftest.mjs
      - run: node tests/v5-selftest.mjs
      - run: node tests/v6-selftest.mjs
      - run: node tests/v6-config-selftest.mjs
      - run: node tests/v6-context-selftest.mjs
      - run: node tests/release-notes-selftest.mjs
      - run: node scripts/check-release-notes.mjs
      - run: node tests/v6-audit-provenance-selftest.mjs
      - run: node tests/host-preflight-selftest.mjs
      - run: node tests/v6.3-selftest.mjs
      - run: node tests/v6.3-budget-selftest.mjs
      - run: node --check benchmarks/v6.3/capture-runtime.mjs
      - run: node --check benchmarks/v6.3/freeze-truth.mjs
      - run: node tests/v6.3.1-selftest.mjs
      - run: node tests/v6.3.1-policy-selftest.mjs
      - run: node tests/v6.3.1-history-selftest.mjs
      - run: node tests/v6.3.2-selftest.mjs
      - run: node tests/v6.3.2-readiness-selftest.mjs
      - run: node tests/v6.3.3-selftest.mjs
      - run: node --check benchmarks/v6.3.3/prepare.mjs
      - run: node --check benchmarks/v6.3.3/grade.mjs
      - run: node --check benchmarks/v6.3.3/parallel-proof.mjs
      - run: node --check benchmarks/v6.3.3/aggregate.mjs
      - run: node --check benchmarks/v6.3.3/history-entry.mjs
      - run: node tests/v6.3.2-budget-authorization-selftest.mjs
  chromium-browser-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for actual headless Chromium checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run isolated DOM browser mutation tests (not Figma E2E)
        run: node tests/v6.3.2-browser-selftest.mjs

